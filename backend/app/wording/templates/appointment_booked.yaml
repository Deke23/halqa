  ar: مرحبًا {name}. تم حجز موعدك في {clinic_name} يوم {appointment_date} الساعة {appointment_time}. إذا لم يناسبك الموعد، أخبرنا وسنساعدك في إيجاد وقت آخر.
  fr: Bonjour {name}. Votre rendez-vous est réservé à {clinic_name} le {appointment_date} à {appointment_time}. Si cela ne vous convient pas, dites-le-nous et nous vous aiderons à trouver un autre horaire.
