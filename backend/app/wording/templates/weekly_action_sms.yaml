# Approved template. Edit the text here, bump `version`, and keep every {slot} listed in required_slots.
id: weekly_action_sms
version: 1
purpose: SMS weekly action.
channel_limits:
  sms:
    en: 160
    fr: 160
    ar: 134
required_slots:
- name
- action_text
sample_slots:
  en:
    name: Khalid
    action_text: leave the salt off one meal
  ar:
    name: خالد
    action_text: وجبة واحدة بلا ملح مضاف
  fr:
    name: Jean-Paul
    action_text: un repas sans sel ajouté
text:
  en: '{name}, this week''s small step: {action_text}. Less is fine. Next week reply A done, B partly, C not done.'
  ar: '{name}، خطوتك الصغيرة هذا الأسبوع: {action_text}. الأقل مقبول. الأسبوع القادم أرسل A تمت، B جزئيًا، C لم تتم.'
  fr: '{name}, petite action de la semaine : {action_text}. Moins, c''est bien. Semaine prochaine : A fait, B en partie, C pas fait.'
sms_chars_with_sample_slots:
  en: 120
  ar: 117
  fr: 138
gsm7_safe_with_sample_slots:
  en: true
  ar: false
  fr: true
