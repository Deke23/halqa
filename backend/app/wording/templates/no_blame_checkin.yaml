# Approved template. Edit the text here, bump `version`, and keep every {slot} listed in required_slots.
id: no_blame_checkin
version: 1
purpose: No-blame check-in after a missed week. Makes the plan smaller.
channel_limits:
  app: 900
  whatsapp: 1000
required_slots:
- name
- action_text
sample_slots:
  en:
    name: Khalid
    action_text: leave the salt off one meal
  ar:
    name: خالد
    action_text: وجبة واحدة بلا ملح مضاف
  fr:
    name: Jean-Paul
    action_text: un repas sans sel ajouté
text:
  en: 'Hello {name}. Weeks do not always go to plan, and a missed week is normal. Your plan simply continues from where you are. We have made this week''s step smaller: {action_text}. If it still feels like too much, tell us and we can make it smaller again or talk with you by phone.'
  ar: 'مرحبًا {name}. لا تسير الأسابيع دائمًا كما نخطط، والأسبوع الذي يفوت أمر طبيعي. خطتك ببساطة تستمر من حيث أنت. جعلنا خطوة هذا الأسبوع أصغر: {action_text}. وإذا بدت لك كثيرة أيضًا، أخبرنا ويمكننا تصغيرها أكثر أو الاتصال بك هاتفيًا.'
  fr: 'Bonjour {name}. Les semaines ne se passent pas toujours comme prévu, et une semaine manquée est normale. Votre plan continue simplement là où vous en êtes. Nous avons rendu l''action de cette semaine plus petite : {action_text}. Si c''est encore trop, dites-le-nous : nous pouvons la réduire encore ou vous appeler.'
