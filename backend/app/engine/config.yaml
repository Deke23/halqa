    value: 2
    unit: x service level
    basis: "Project specification section 4.3. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  level2_multiplier_severe:
    value: 1
    unit: x service level
    basis: "Project specification section 4.3. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff

unreachable_protocol:
  reminder_after:
    value: 24
    unit: hours
    basis: "Project specification section 4.3. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  second_channel_after:
    value: 48
    unit: hours
    basis: "Project specification section 4.3. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  call_task_after:
    value: 72
    unit: hours
    basis: "Project specification section 4.3. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  clinician_decision_after:
    value: 120
    unit: hours
    basis: "Assumption: two days after the call task, the case is flagged for a clinician decision. It is never closed automatically."
    status: placeholder_pending_clinician_signoff

closure:
