# Single source for clinical thresholds and service levels.
# Every entry is a placeholder pending clinician sign-off. None of these values is clinically validated.
# `basis` states where the number comes from or that it is an assumption.

thresholds:
  raised_systolic:
    value: 140
    unit: mmHg
    basis: "Common outpatient cut-off for a raised reading, used here as a screening trigger only. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff
  raised_diastolic:
    value: 90
    unit: mmHg
    basis: "Common outpatient cut-off for a raised reading, used here as a screening trigger only. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff
  severe_systolic:
    value: 180
    unit: mmHg
    basis: "Routing rule from the project specification (section 4.2): same-day clinician review. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff
  severe_diastolic:
    value: 110
    unit: mmHg
    basis: "Routing rule from the project specification (section 4.2): same-day clinician review. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff
  hbpm_systolic:
    value: 135
    unit: mmHg
    basis: "Home blood pressure average threshold from the project specification. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff
  hbpm_diastolic:
    value: 85
    unit: mmHg
    basis: "Home blood pressure average threshold from the project specification. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff
  hbpm_min_days:
    value: 4
    unit: days
    basis: "Days with enough readings, counting the discarded first day. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff
  hbpm_min_readings_per_day:
    value: 2
    unit: readings
    basis: "Minimum readings for a day to count. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff
  abpm_daytime_systolic:
    value: 135
    unit: mmHg
    basis: "Daytime ambulatory average threshold from the project specification. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff
  abpm_daytime_diastolic:
    value: 85
    unit: mmHg
    basis: "Daytime ambulatory average threshold from the project specification. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff
  abpm_daytime_start_hour:
    value: 7
    unit: hour of day (patient region local time)
    basis: "Assumption: daytime window used for the ambulatory average."
    status: placeholder_pending_clinician_signoff
  abpm_daytime_end_hour:
    value: 22
    unit: hour of day (patient region local time)
    basis: "Assumption: daytime window used for the ambulatory average."
    status: placeholder_pending_clinician_signoff
  abpm_min_daytime_readings:
    value: 14
    unit: readings
    basis: "Assumption: minimum daytime readings for a usable ambulatory recording."
    status: placeholder_pending_clinician_signoff
  target_systolic:
    value: 130
    unit: mmHg
    basis: "Assumption: a clinic reading below this and below the diastolic target counts as at target for the ready-to-close prompt."
    status: placeholder_pending_clinician_signoff
  target_diastolic:
    value: 80
    unit: mmHg
    basis: "Assumption: see target_systolic."
    status: placeholder_pending_clinician_signoff
  target_consecutive_readings:
    value: 3
    unit: readings
    basis: "Project specification (scenario ready_to_close): last three clinic readings at target. Assumption pending sign-off."
    status: placeholder_pending_clinician_signoff

service_levels:
  result_issued:
