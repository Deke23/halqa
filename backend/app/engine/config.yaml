    unit: check-ins
    basis: "Project specification section 4.6."
    status: placeholder_pending_clinician_signoff
  done_in_row_to_offer_larger:
    value: 2
    unit: check-ins
    basis: "Project specification section 4.6."
    status: placeholder_pending_clinician_signoff
  missed_in_row_for_call_task:
