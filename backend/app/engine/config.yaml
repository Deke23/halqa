    basis: "Project specification section 4.1. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  result_issued_severe:
    value: 2
    unit: hours
    basis: "Project specification section 4.1. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  urgent_review:
    value: 4
    unit: hours
    basis: "Same-day clinician review of a severe reading, project specification section 4.2. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  notified:
    value: 72
    unit: hours
    basis: "Project specification section 4.1. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  acknowledged:
    value: 14
    unit: days
    basis: "Project specification section 4.1. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  confirmed:
    value: 3
    unit: days
    basis: "Project specification section 4.1. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  closure_decision:
    value: 3
    unit: days
    basis: "Clinician closure decision after a not-confirmed review, project specification section 4.1 clarifications. Placeholder pending sign-off."
