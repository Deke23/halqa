# Single source for clinical thresholds and service levels.
# Every entry is a placeholder pending clinician sign-off. None of these values is clinically validated.
# `basis` states where the number comes from or that it is an assumption. `label_i18n`, `basis_i18n` and `unit_i18n` carry
# the display text in en, ar and fr; the API passes them through unchanged.

