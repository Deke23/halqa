  referral_accept:
    value: 2
    unit: days
    basis: "Project specification section 4.1. Placeholder pending sign-off."
    status: placeholder_pending_clinician_signoff
  appointment_booking:
    value: 5
    unit: days
    basis: "Project specification section 4.1. Placeholder pending sign-off."
