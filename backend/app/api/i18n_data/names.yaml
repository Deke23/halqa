task_titles:
  urgent_review: {en: Same-day clinician review, ar: مراجعة الطبيب في اليوم نفسه, fr: Revue clinique le jour même}
  call_the_patient: {en: Call the patient, ar: الاتصال بالمريض, fr: Appeler le patient}
  offer_a_call: {en: Offer a call, ar: عرض مكالمة, fr: Proposer un appel}
  decide_unreachable_patient: {en: Decide about a patient who could not be reached, ar: اتخاذ قرار بشأن مريض تعذّر الوصول إليه, fr: Décider pour un patient resté injoignable}
  contact_by_another_agreed_route: {en: Contact by another agreed route, ar: التواصل بوسيلة أخرى متفق عليها, fr: Contacter par un autre moyen convenu}
  decide_after_care_coordination_withdrawn: {en: Decide after the patient withdrew care coordination, ar: اتخاذ قرار بعد أن سحب المريض موافقته على تنسيق الرعاية, fr: Décider après le retrait de l'accord pour la coordination des soins}

closure_evidence:
  BP_CONTROLLED: {en: Blood pressure at target, ar: ضغط الدم ضمن الهدف, fr: Tension dans la cible}
  NOT_CONFIRMED: {en: Raised reading not confirmed, ar: لم تتأكد القراءة المرتفعة, fr: Mesure élevée non confirmée}
  CARE_TRANSFERRED: {en: Care transferred, ar: نُقلت الرعاية, fr: Suivi transféré}
  PATIENT_DECLINED: {en: Patient declined follow-up, ar: رفض المريض المتابعة, fr: Le patient a refusé le suivi}
  UNREACHABLE_AFTER_PROTOCOL: {en: Patient not reached after the contact steps, ar: تعذّر الوصول إلى المريض بعد خطوات التواصل, fr: Patient injoignable après les étapes de contact}
  DECEASED_OR_MOVED: {en: Deceased or moved away, ar: توفي أو انتقل, fr: Décédé ou déménagé}
  OTHER_CLINICAL_DECISION: {en: Other clinical decision, ar: قرار سريري آخر, fr: Autre décision clinique}

all_people: {en: All people, ar: جميع الأشخاص, fr: Toutes les personnes}

cover:
  thiqa: {en: "Covered by Thiqa (simulated), no co-payment", ar: "مغطى بموجب ثقة (محاكاة)، دون مشاركة في الدفع", fr: "Couvert par Thiqa (simulé), sans ticket modérateur"}
  basic: {en: "Covered by basic plan (simulated), co-payment AED {copay}", ar: "مغطى بموجب الخطة الأساسية (محاكاة)، مشاركة في الدفع AED {copay}", fr: "Couvert par le régime de base (simulé), ticket modérateur de {copay} AED"}
  self_pay: {en: "Self-pay estimate (simulated)", ar: "تقدير الدفع الذاتي (محاكاة)", fr: "Estimation du paiement direct (simulé)"}
  estimate: {en: "Estimated price (simulated)", ar: "السعر التقديري (محاكاة)", fr: "Prix estimé (simulé)"}

rules:
  - {en: "Rules decide routing, urgency, ownership, SLA and closure. AI only drafts wording and never takes part in those decisions.", ar: "القواعد هي التي تقرر التوجيه والاستعجال والمسؤولية ومدة الخدمة والإغلاق. الذكاء الاصطناعي يصيغ النصوص فقط ولا يشارك في هذه القرارات.", fr: "Les règles décident de l'orientation, de l'urgence, de la responsabilité, des délais et de la clôture. L'IA ne fait que rédiger des textes et ne participe jamais à ces décisions."}
  - {en: "Only a clinician can close a case, and only with an evidence type plus an evidence reference or a decision note.", ar: "الطبيب وحده يستطيع إغلاق الحالة، وذلك بنوع دليل مع مرجع دليل أو ملاحظة قرار.", fr: "Seul un clinicien peut clôturer un dossier, avec un type de preuve et une référence de preuve ou une note de décision."}
  - {en: "Blood pressure values come only from a validated cuff or ambulatory monitor. Wearable data is never used as a blood pressure value.", ar: "قيم ضغط الدم تأتي فقط من جهاز قياس معتمد أو جهاز مراقبة متنقل. بيانات الأجهزة القابلة للارتداء لا تُستخدم أبدًا كقيمة لضغط الدم.", fr: "Les valeurs de tension viennent uniquement d'un tensiomètre validé ou d'un moniteur ambulatoire. Les données des objets connectés ne sont jamais utilisées comme valeur de tension."}
  - {en: "The dashboard is aggregate only and hides any cell with fewer than 5 people.", ar: "لوحة المؤشرات تعرض مجاميع فقط وتخفي أي خلية تضم أقل من 5 أشخاص.", fr: "Le tableau de bord n'affiche que des agrégats et masque toute cellule de moins de 5 personnes."}

notice: {en: "Every threshold and service level is a placeholder pending clinician sign-off. None is clinically validated.", ar: "كل حد ومدة خدمة هنا قيمة مؤقتة بانتظار اعتماد الأطباء. لا شيء منها معتمد سريريًا.", fr: "Chaque seuil et chaque délai de service est une valeur provisoire en attente de validation par les cliniciens. Aucun n'est validé cliniquement."}
