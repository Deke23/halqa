    assign_owner: {en: assign_owner, ar: تعيين مسؤول, fr: attribuer un responsable}
    book_appointment: {en: book_appointment, ar: حجز موعد, fr: réserver un rendez-vous}
    record_visit: {en: record_visit, ar: تسجيل الزيارة, fr: enregistrer la visite}
    plan_checkin: {en: plan_checkin, ar: متابعة الخطة, fr: point de suivi du plan}
    escalate: {en: escalate, ar: التصعيد, fr: escalader}
