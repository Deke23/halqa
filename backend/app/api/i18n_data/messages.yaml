    reopen: {en: reopen, ar: إعادة الفتح, fr: rouvrir}
    update_consent: {en: update_consent, ar: تغيير الموافقة, fr: modifier le consentement}
    complete_urgent_review: {en: complete_urgent_review, ar: إكمال المراجعة العاجلة, fr: terminer la revue urgente}
